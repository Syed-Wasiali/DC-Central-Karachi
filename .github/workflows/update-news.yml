name: Update news

# Refreshes news.json from the Commissioner Karachi and Government of Sindh
# websites every 3 hours. It can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: pip install requests beautifulsoup4
      - name: Fetch latest news
        run: python scripts/update_news.py
      - name: Save changes
        run: |
          if git diff --quiet -- news.json; then
            echo "No new news."
            exit 0
          fi
          git config user.name "news-updater"
          git config user.email "news-updater@users.noreply.github.com"
          git add news.json
          git commit -m "Update news from Commissioner Karachi and Government of Sindh"
          git push
